services:
  backend:
    image: ghcr.io/priyeshraiminfy/breakbot-api:latest
    build:
      context: ./Phase1-VulnarabilitiReport
      dockerfile: web/api/Dockerfile
    container_name: breakbot-api
    environment:
      - SCANS_DIR=/app/scans
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    volumes:
      - breakbot-scans:/app/scans
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/priyeshraiminfy/breakbot-ui:latest
    build:
      context: ./Phase1-VulnarabilitiReport/web/frontend
      dockerfile: Dockerfile
    container_name: breakbot-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  breakbot-scans:
